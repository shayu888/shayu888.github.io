<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>使用浏览器打开</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto;}
body{background:#ffffff;}

/* 顶部蓝色渐变横幅，截图同款蓝调 */
.header{
    width:100%;
    height:240px;
    background:linear-gradient(135deg,#0095ee,#47d1ff);
    position:relative;
    overflow:hidden;
    color:#fff;
}

/* 右上角白色箭头 */
.arrow{
    position:absolute;
    right:24px;
    top:16px;
    width:90px;
    height:90px;
    color:#ffffff;
    font-size:90px;
    font-weight:bold;
    opacity:0.9;
}

/* 蓝色区域里的步骤说明 */
.steps{
    position:absolute;
    left:24px;
    right:24px;
    top:30px;
    text-align:left;
}
.steps h3{
    font-size:17px;
    font-weight:600;
    margin-bottom:14px;
}
.step-item{
    display:flex;
    align-items:flex-start;
    margin-bottom:12px;
    font-size:14px;
    line-height:1.5;
}
.step-num{
    flex-shrink:0;
    width:24px;
    height:24px;
    background:#ffffff;
    color:#0095ee;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:10px;
    font-size:13px;
}

/* 白色主体区，增加上边距，整体往下挪 */
.main{
    padding-top:60px;
    padding-left:24px;
    padding-right:24px;
    text-align:center;
}
.tip-text{
    font-size:16px;
    color:#2266bb;
    line-height:2.2;
    margin-bottom:18px;
}
.desc-text{
    color:#666666;
    font-size:14px;
    margin:16px 0;
}
.copy-btn{
    padding:10px 32px;
    font-size:15px;
    border:1px solid #c9d6ee;
    background:#fff;
    color:#2266bb;
    border-radius:999px;
    cursor:pointer;
}
.toast{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    background:rgba(0,0,0,0.7);
    color:#fff;
    padding:12px 20px;
    border-radius:8px;
    display:none;
}
</style>
</head>
<body>

<div class="header">
    <!-- 右上角白色箭头 -->
    <div class="arrow">↗</div>

    <!-- 蓝色区域内的步骤 -->
    <div class="steps">
        <h3>操作教程</h3>
        <div class="step-item">
            <div class="step-num">1</div>
            <div>点击右上角“⋯”打开菜单，选择在浏览器中打开</div>
        </div>
        <div class="step-item">
            <div class="step-num">2</div>
            <div>点击下方按钮复制本站网址</div>
        </div>
        <div class="step-item">
            <div class="step-num">3</div>
            <div>打开手机浏览器，粘贴网址后访问</div>
        </div>
    </div>
</div>

<div class="main">
    <div class="tip-text">
        1.本站不支持 微信或QQ 内访问<br>
        2.请按提示在手机浏览器打开
    </div>

    <div class="desc-text">点击右上角 ⋯ 或复制网址自行打开</div>
    <br>
    <button class="copy-btn" id="copyBtn">点此复制本站网址</button>
</div>

<div class="toast" id="toast">复制成功</div>

<script>
// 修改这里为你的目标外链
const targetUrl = "https://kefu365.top/#/?uid=f8s";
const copyBtn = document.getElementById('copyBtn');
const toast = document.getElementById('toast');

function isWeChat(){
  return navigator.userAgent.toLowerCase().indexOf('micromessenger') !== -1;
}

copyBtn.onclick = function(){
  navigator.clipboard.writeText(targetUrl).then(()=>{
    toast.style.display = 'block';
    setTimeout(()=>toast.style.display = 'none',1800);
  })
}

if(!isWeChat()){
  location.href = targetUrl;
}
</script>

</body>
</html>
